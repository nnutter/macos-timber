name: CI

on:
  pull_request:

jobs:
  verify:
    name: Lint, build, and test
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install tools
        uses: jdx/mise-action@v2

      - name: Lint and format check
        run: mise run lint

      - name: Build app bundle
        run: mise run build

      - name: Run tests
        run: mise run test
